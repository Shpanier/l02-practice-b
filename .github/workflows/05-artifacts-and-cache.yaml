name: 05 Artifacts and cache

on:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "report of run $GITHUB_RUN_NUMBER" > report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: report.txt

  consumer:
    runs-on: ubuntu-24.04
    needs: producer
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
      - run: cat report.txt

  cache:
    runs-on: ubuntu-24.04
    steps:
      - id: demo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: slow-result
          key: slow-result-v1
      - name: Slow work, only on a cache miss
        if: steps.demo.outputs.cache-hit != 'true'
        run: |
          sleep 20
          mkdir -p slow-result
          date > slow-result/made-at.txt
      - run: |
          echo "cache-hit=${{ steps.demo.outputs.cache-hit }}"
          cat slow-result/made-at.txt
